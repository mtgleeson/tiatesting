plugins {
    id 'java'
    id 'signing'
    id 'maven-publish'
}

// Use the build script defined in buildSrc
apply from: rootProject.file('buildSrc/shared.gradle')

dependencies {
    implementation project(':tia-core')
    // Compiled against only: the test runner supplies the launcher matching the project's JUnit
    // (5 or 6), so Tia never chooses its version.
    compileOnly group: 'org.junit.platform', name: 'junit-platform-launcher', version: junit5PlatformVersion
    compileOnly group: 'org.slf4j', name: 'slf4j-api', version: slf4jVersion // don't include in transitive dependencies

    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter', version: junit5EngineVersion
    testImplementation group: 'org.junit.platform', name: 'junit-platform-launcher', version: junit5PlatformVersion
    testImplementation 'org.mockito:mockito-core:4.11.0'
    // slf4j-api is compileOnly above, so the listener's logger needs a binding (and the api it
    // binds to) on the test runtime classpath.
    testRuntimeOnly 'org.slf4j:slf4j-simple:1.7.32'
}

test {
    useJUnitPlatform()
}

// JUnit 6 compatibility: the Java 8 listener, run by the JUnit 6 launcher on a Java 17+ JVM (JUnit
// 6's baseline). The suite is compiled for Java 17 against JUnit 6; main stays Java 8 against JUnit 5.
sourceSets {
    junit6Test {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    junit6TestImplementation.extendsFrom implementation
    junit6TestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    junit6TestImplementation platform("org.junit:junit-bom:$junit6Version")
    junit6TestImplementation 'org.junit.jupiter:junit-jupiter'
    junit6TestImplementation 'org.junit.platform:junit-platform-launcher'
    // The listener logs through SLF4J, which main only compiles against.
    junit6TestImplementation group: 'org.slf4j', name: 'slf4j-api', version: slf4jVersion
    junit6TestRuntimeOnly 'org.slf4j:slf4j-simple:1.7.32'
}

// A locally installed JDK: Gradle's own detection, or org.gradle.java.installations.paths.
def junit6TestJava = JavaLanguageVersion.of(Integer.parseInt(junit6TestJavaVersion))

tasks.named('compileJunit6TestJava') {
    javaCompiler = javaToolchains.compilerFor { languageVersion = junit6TestJava }
    options.release = 17
}

def junit6Test = tasks.register('junit6Test', Test) {
    description = 'Runs the Tia listener under the JUnit 6 launcher on a Java 17+ JVM.'
    group = 'verification'
    testClassesDirs = sourceSets.junit6Test.output.classesDirs
    classpath = sourceSets.junit6Test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor { languageVersion = junit6TestJava }
    useJUnitPlatform()
    // The fixtures are run by the test through its own launcher, never directly.
    exclude 'org/tiatesting/junit/junit5/junit6fixtures/**'
}

tasks.named('check') {
    dependsOn junit6Test
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'tia-junit5'

            pom {
                name = 'Tia JUnit5'
                description = 'This library contains the logic for running Tia with JUnit5. Add it as a test dependency; it works with any VCS.'
            }
        }
    }
}

// The test runner (Surefire, Gradle) supplies the JUnit Platform launcher matching the project's
// JUnit. A version published here lands on every project's test classpath and can mismatch the
// project's engine: on Maven, JUnit 6 next to a 1.x launcher fails test discovery.
tasks.register('verifyPublishedPom') {
    description = 'Fails if the published POM declares a JUnit dependency, which would pin the ' +
            'JUnit version on the projects that use this module.'
    def pomTask = tasks.named('generatePomFileForMavenJavaPublication')
    dependsOn pomTask
    doLast {
        def pom = new groovy.xml.XmlSlurper().parse(pomTask.get().destination)
        def junit = pom.dependencies.dependency
                .findAll { it.groupId.text().startsWith('org.junit') }
                .collect { it.groupId.text() + ':' + it.artifactId.text() }
        if (!junit.isEmpty()) {
            throw new GradleException("The published POM must not declare JUnit, but declares: " + junit)
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyPublishedPom'
}
