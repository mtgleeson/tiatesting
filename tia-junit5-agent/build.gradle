plugins {
    id 'java'
    id 'signing'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

// Use the build script defined in buildSrc
apply from: rootProject.file('buildSrc/shared.gradle')

configurations {
    // Bundled (relocated) into the agent jar and nowhere else: not a published dependency.
    agentBundle
    compileOnly.extendsFrom agentBundle
    testImplementation.extendsFrom agentBundle
}

dependencies {
    // Compiled against, but only the three classes premain uses are copied into the agent jar.
    compileOnly project(':tia-core')
    agentBundle group: 'net.bytebuddy', name: 'byte-buddy', version: '1.17.5'
    // No slf4j: the agent must start even where none of the project's classes are reachable from the
    // system class loader, so it can use only the JDK and what this jar bundles.

    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter', version: junit5EngineVersion
}

test {
    useJUnitPlatform()
}

// JUnit 6 compatibility: the agent's own tests, re-run with JUnit forced to 6.x on a Java 17+ JVM
// (JUnit 6's baseline), so the @Disabled the agent adds is described from JUnit 6's class files.
// The tests only use @Test, @Disabled and Assertions, which JUnit 6 kept, so the classes compiled
// for the Java 8 test task are reused as they are.
configurations {
    // The test runtime's dependencies, resolved as a Java 17 runtime classpath: JUnit 6 publishes
    // Java 17 variants only, which the Java 8 test runtime classpath would reject.
    junit6TestRuntimeClasspath {
        canBeConsumed = false
        extendsFrom testImplementation, testRuntimeOnly
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
        }
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group in ['org.junit.jupiter', 'org.junit.platform']) {
                details.useVersion junit6Version
                details.because 'JUnit 6 compatibility run'
            }
        }
    }
}

dependencies {
    junit6TestRuntimeClasspath "org.junit.platform:junit-platform-launcher:$junit6Version"
}

// A locally installed JDK: Gradle's own detection, or org.gradle.java.installations.paths.
def junit6Test = tasks.register('junit6Test', Test) {
    description = 'Runs the agent tests on JUnit 6 on a Java 17+ JVM.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.output + sourceSets.main.output + configurations.junit6TestRuntimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(junit6TestJavaVersion))
    }
    useJUnitPlatform()
}

Map <String, ?> attrs = [ 'Premain-Class': 'org.tiatesting.agent.Agent',
                          'Can-Redefine-Classes': true,
                          'Can-Retransform-Classes': true,
                          'Agent-Class': 'org.tiatesting.agent.Agent']

// The -javaagent jar. On Gradle it sits on the system classpath ahead of the test classpath, so it
// may carry nothing a project could also have: only the agent, the three tia-core classes premain
// uses, and ByteBuddy relocated into Tia's own package so it can never shadow a project's copy.
// The three tia-core classes also reach the test classpath through tia-junit5; on Gradle the agent's
// copies load first, which is harmless because both come from the same Tia version.
shadowJar {
    archiveClassifier = 'runtime'
    manifest {
        attributes attrs
    }
    configurations = [project.configurations.agentBundle]
    from(project(':tia-core').sourceSets.main.output) {
        include 'org/tiatesting/core/agent/AgentOptions*'
        include 'org/tiatesting/core/agent/ForkSystemProperties*'
        include 'org/tiatesting/core/agent/CommandLineSupport*'
    }
    exclude 'META-INF/versions/**'
    exclude 'META-INF/maven/**'
    exclude '**/module-info.class'
    relocate 'net.bytebuddy', 'org.tiatesting.shaded.bytebuddy'
}

// The allowed contents of the agent jar. Anything else could shadow a class the project has.
def agentJarAllowedPrefixes = ['META-INF/', 'org/tiatesting/agent/', 'org/tiatesting/shaded/bytebuddy/',
                               'org/tiatesting/core/agent/AgentOptions', 'org/tiatesting/core/agent/ForkSystemProperties',
                               'org/tiatesting/core/agent/CommandLineSupport']
def agentJarAllowedDirectories = ['org/', 'org/tiatesting/', 'org/tiatesting/core/', 'org/tiatesting/core/agent/',
                                  'org/tiatesting/shaded/']

tasks.register('verifyAgentJar') {
    description = 'Fails if the -javaagent jar contains anything outside Tia\'s own packages, or ' +
            'refers to a Tia class it does not contain.'
    def agentJar = tasks.named('shadowJar').flatMap { it.archiveFile }
    inputs.file(agentJar)
    doLast {
        def unexpected = new java.util.zip.ZipFile(agentJar.get().asFile).withCloseable { zip ->
            zip.entries().collect { it.name }.findAll { name ->
                !agentJarAllowedDirectories.contains(name) && !agentJarAllowedPrefixes.any { name.startsWith(it) }
            }
        }
        if (!unexpected.isEmpty()) {
            throw new GradleException("The Tia agent jar must only contain Tia's own packages, but it also "
                    + "contains: " + unexpected.take(20))
        }
        // The jar must also be self-sufficient: with Surefire's useSystemClassLoader=false, nothing
        // from the project's tia-core is reachable when the agent starts. Scans each bundled Tia
        // class's constant pool text for references to other Tia classes (the relocated ByteBuddy
        // is a complete library and is not scanned).
        def missing = new java.util.zip.ZipFile(agentJar.get().asFile).withCloseable { zip ->
            def classes = zip.entries().collect { it.name }.findAll { it.endsWith('.class') } as Set
            def referenced = [] as Set
            classes.findAll { !it.startsWith('org/tiatesting/shaded/') }.each { name ->
                def text = new String(zip.getInputStream(zip.getEntry(name)).bytes, 'ISO-8859-1')
                (text =~ /org\/tiatesting\/(?:agent|core)\/[A-Za-z0-9_\/\$]+/).each { referenced << it }
            }
            referenced.findAll { !classes.contains(it + '.class') }
        }
        if (!missing.isEmpty()) {
            throw new GradleException("The Tia agent jar refers to Tia classes it does not contain, so the "
                    + "agent would fail to start where the project's tia-core is not reachable: " + missing)
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyAgentJar', junit6Test
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'tia-junit5-agent'

            pom {
                name = 'Tia JUnit5 Agent'
                description = 'This library contains the agent used for Tia with JUnit5.'
            }
        }
    }
}